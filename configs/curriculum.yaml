# Curriculum Learning Configuration
# NOTE: reward_shaping keys must be bot reward-signal names (see
# src/env/rewards.py KNOWN_SIGNAL_KEYS): alive_tick, death, damage_taken,
# mob_killed, player_killed, item_mined, item_crafted, block_placed,
# item_lost, food_eaten, shelter_complete, distance_moved.
curriculum:
  stages:
    - name: "basic_movement"
      goal: "explore"
      max_episode_steps: 200
      success_threshold: 0.8
      reward_shaping:
        distance_moved: 1.0
        damage_taken: -5.0
      description: "Learn to walk, turn, jump, and look around"

    - name: "punch_wood"
      goal: "gather_logs"
      max_episode_steps: 500
      success_threshold: 0.7
      reward_shaping:
        item_mined: 2.0
      description: "Find and punch trees to collect logs"

    - name: "craft_pickaxe"
      goal: "craft_pickaxe"
      max_episode_steps: 500
      success_threshold: 0.7
      reward_shaping:
        item_crafted: 5.0
      description: "Craft a crafting table and wooden pickaxe"

    - name: "mine_stone"
      goal: "gather_stone"
      max_episode_steps: 1000
      success_threshold: 0.6
      reward_shaping:
        item_mined: 1.0
        item_crafted: 3.0
      description: "Mine cobblestone with a pickaxe"

    - name: "fight_passive"
      goal: "eat_food"
      max_episode_steps: 500
      success_threshold: 0.6
      reward_shaping:
        mob_killed: 10.0
        damage_taken: -1.0
      description: "Fight and kill passive mobs (cows, pigs)"

    - name: "fight_hostile"
      goal: "fight_hostile"
      max_episode_steps: 1000
      success_threshold: 0.5
      reward_shaping:
        mob_killed: 20.0
        damage_taken: -2.0
      description: "Fight and kill hostile mobs (zombies, skeletons)"

    - name: "build_shelter"
      goal: "build_shelter"
      max_episode_steps: 1000
      success_threshold: 0.5
      reward_shaping:
        block_placed: 5.0
        shelter_complete: 50.0
      description: "Build a 5x5 enclosed shelter"

    - name: "survive_first_night"
      goal: "survive_first_night"
      max_episode_steps: 2000
      success_threshold: 0.6
      reward_shaping:
        alive_tick: 0.5
        shelter_complete: 10.0
      description: "Survive from spawn through the first night"

    - name: "mine_iron"
      goal: "gather_iron"
      max_episode_steps: 3000
      success_threshold: 0.4
      reward_shaping:
        item_mined: 5.0
      description: "Find and mine iron ore deep underground"

    - name: "full_survival"
      goal: "survive"
      max_episode_steps: 6000
      success_threshold: 0.5
      reward_shaping: {}
      description: "Full open-world survival episode"

    - name: "pvp_combat"
      goal: "fight_hostile"
      max_episode_steps: 2000
      success_threshold: 0.4
      reward_shaping:
        player_killed: 50.0
        mob_killed: 5.0
      description: "Fight and defeat other players/bots in PvP"
