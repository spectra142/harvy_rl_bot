# Curriculum Learning Configuration
curriculum:
  stages:
    - name: "basic_movement"
      goal: "basic_movement"
      max_episode_steps: 200
      success_threshold: 0.8
      reward_shaping:
        distance_reward: 1.0
        fall_penalty: -5.0
      description: "Learn to walk, turn, jump, and look around"
      
    - name: "punch_wood"
      goal: "punch_wood"
      max_episode_steps: 500
      success_threshold: 0.7
      reward_shaping:
        log_reward: 2.0
        pickup_reward: 1.0
      description: "Find and punch trees to collect logs"
      
    - name: "craft_pickaxe"
      goal: "craft_pickaxe"
      max_episode_steps: 500
      success_threshold: 0.7
      reward_shaping:
        craft_reward: 5.0
        plank_reward: 1.0
        stick_reward: 1.0
      description: "Craft a crafting table and wooden pickaxe"
      
    - name: "mine_stone"
      goal: "mine_stone"
      max_episode_steps: 1000
      success_threshold: 0.6
      reward_shaping:
        stone_reward: 1.0
        pickaxe_bonus: 3.0
      description: "Mine cobblestone with a pickaxe"
      
    - name: "fight_passive"
      goal: "fight_passive"
      max_episode_steps: 500
      success_threshold: 0.6
      reward_shaping:
        kill_reward: 10.0
        hit_reward: 2.0
      description: "Fight and kill passive mobs (cows, pigs)"
      
    - name: "fight_hostile"
      goal: "fight_hostile"
      max_episode_steps: 1000
      success_threshold: 0.5
      reward_shaping:
        kill_reward: 20.0
        hit_reward: 5.0
        health_penalty: -2.0
      description: "Fight and kill hostile mobs (zombies, skeletons)"
      
    - name: "build_shelter"
      goal: "build_shelter"
      max_episode_steps: 1000
      success_threshold: 0.5
      reward_shaping:
        block_placed: 5.0
        shelter_complete: 50.0
        wasted_block: -1.0
      description: "Build a 5x5 enclosed shelter"
      
    - name: "survive_first_night"
      goal: "survive_first_night"
      max_episode_steps: 2000
      success_threshold: 0.6
      reward_shaping:
        survive_reward: 1.0
        mob_avoidance: 2.0
        shelter_bonus: 10.0
      description: "Survive from spawn through the first night"
      
    - name: "mine_iron"
      goal: "mine_iron"
      max_episode_steps: 3000
      success_threshold: 0.4
      reward_shaping:
        iron_reward: 5.0
        coal_reward: 2.0
        depth_bonus: 1.0
      description: "Find and mine iron ore deep underground"
      
    - name: "full_survival"
      goal: "full_survival"
      max_episode_steps: 6000
      success_threshold: 0.5
      reward_shaping:
        composite_score: 1.0
      description: "Full open-world survival episode"
      
    - name: "pvp_combat"
      goal: "pvp_combat"
      max_episode_steps: 2000
      success_threshold: 0.4
      reward_shaping:
        player_kill: 50.0
        player_hit: 10.0
        survival_bonus: 5.0
      description: "Fight and defeat other players/bots in PvP"
